name: Authorize statistics login domain
on:
  push:
    branches: [main]
    paths: [.github/workflows/authorize-statistics-domain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Add the statistics site to Firebase Authentication
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIBRARY_EXAM_NOTEBOOK }}
        run: |
          set -euo pipefail
          credential_file="$RUNNER_TEMP/firebase-auth-domain-credentials.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credential_file"
          gcloud auth activate-service-account --key-file="$credential_file" --quiet
          export AUTH_TOKEN="$(gcloud auth print-access-token)"
          python3 -c '
          import json, os, sys, urllib.request, urllib.error
          url = "https://identitytoolkit.googleapis.com/admin/v2/projects/library-exam-notebook/config"
          headers = {"Authorization": "Bearer " + os.environ["AUTH_TOKEN"], "Content-Type": "application/json"}
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  config = json.load(response)
              domains = config.get("authorizedDomains", [])
              domain = "statistics-exam-notebook.web.app"
              if domain not in domains:
                  domains.append(domain)
                  body = json.dumps({"authorizedDomains": domains}).encode()
                  request = urllib.request.Request(url + "?updateMask=authorizedDomains", data=body, headers=headers, method="PATCH")
                  with urllib.request.urlopen(request) as response:
                      updated = json.load(response)
                  if domain not in updated.get("authorizedDomains", []):
                      raise RuntimeError("Domain was not present in updated configuration")
              print("Statistics site is authorized for Firebase Authentication.")
          except urllib.error.HTTPError as error:
              print("Firebase Authentication configuration request failed:", error.code, error.read().decode(), file=sys.stderr)
              sys.exit(1)
          '
