name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Check, build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test questions, explanations and sync
        run: npm test
      - name: Build static website
        run: npm run build
      - name: Check exported routes and source links
        run: node tests/http-check.mjs
      - name: Check deployment authorization
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIBRARY_EXAM_NOTEBOOK }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::Firebase deployment is not authorized yet. Run firebase init hosting:github to create FIREBASE_SERVICE_ACCOUNT_LIBRARY_EXAM_NOTEBOOK in this repository, then re-run this workflow.'
            exit 1
          fi
      - name: Create the statistics hosting site when needed
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIBRARY_EXAM_NOTEBOOK }}
        run: |
          credential_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credential_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          if npx --yes firebase-tools@15.34.0 hosting:sites:list --project library-exam-notebook | grep -Eq '^statistics-exam-notebook([[:space:]]|$)'; then
            echo 'Statistics hosting site already exists.'
          else
            npx --yes firebase-tools@15.34.0 hosting:sites:create statistics-exam-notebook --project library-exam-notebook
          fi
      - name: Deploy to the live website
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIBRARY_EXAM_NOTEBOOK }}
          projectId: library-exam-notebook
          channelId: live
          firebaseToolsVersion: '15.34.0'
